# Outlet alignment, used for the cross-alignment corroboration check (README: 'What makes it
# trustworthy'). An unlisted outlet simply gets no alignment tag and still counts toward the
# independent-outlet tally — this file only decides whether reporting SPANS perspectives.
#
# `alignment` is not a credibility score. It answers one question: if two outlets both report a
# contested claim, are they two genuinely different vantage points, or the same one twice? A
# claim corroborated only by outlets sharing an alignment has not really been corroborated.
#
# `credibility` is separate and advisory. `low` does not mean "false" — a state broadcaster is
# often the first and only source for what a state did, and excluding it would blind the atlas to
# one side of every war it fights. It means "treat as a claim by this actor, not as a finding".
#
# This is an editorial judgement, and a contestable one. It is versioned here so it can be argued
# with rather than buried in a prompt.

# ---- global wire services and broadsheets: the default reference points ----
