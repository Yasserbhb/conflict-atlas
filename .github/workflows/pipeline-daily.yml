name: Daily conflict update

# Runs in the cloud on a schedule — your PC does not need to be on.
#
# One question per run: what is the oldest day we have not checked yet? Days already recorded in
# the coverage ledger are skipped, a day that failed or came back blind is retried, and a day that
# can never be searched is left behind after a few attempts so it cannot stall the queue.
#
# The day it scans is deliberately about a week behind today. That is not a delay for its own sake:
# an event newer than T_SETTLE_DAYS is marked provisional and excluded from the applied set, so a
# job that scanned "today" would run forever and never add anything. The lag also gives claims time
# to be corroborated or retracted before they are recorded, which suits a historical atlas.
#
# AUTO-APPLIES only the confidently-corroborated findings, writes a digest to ai-updater/log/, and
# pushes (which redeploys the live map). Everything is reversible via git history.

on:
  schedule:
    - cron: "0 6 * * *"      # every day, 06:00 UTC
  workflow_dispatch: {}        # ...and a manual "Run" button for testing

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline
        run: pip install -r ai-updater/requirements.txt

      - name: Scan the next unchecked day and auto-apply confident findings
        working-directory: ai-updater
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Typed decisions — resolver match, event kind, severity, roles, status,
          # and the verify verdict + its confidence. See judge.py.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Where the cursor starts walking, and how many days it drains per run. Set them as repo
          # VARIABLES (Settings > Secrets and variables > Actions > Variables) to move the window
          # without editing code. A start date far in the past is a backlog the daily job may
          # never close -- fill old periods with a one-off `scan "1974..1975"` instead.
          PIPELINE_START_DATE: ${{ vars.PIPELINE_START_DATE || '2026-06-01' }}
          PIPELINE_MAX_DAYS_PER_RUN: ${{ vars.PIPELINE_MAX_DAYS_PER_RUN || '3' }}
          JUDGE_BACKEND: ${{ vars.JUDGE_BACKEND || 'jev' }}
        # ~3 LLM calls per candidate (batched), so a day at --limit 5 costs ~17 calls — inside a
        # typical free ~50/day allowance. --days >1 drains a backlog and multiplies that cost, so
        # raise the two together only if the quota allows.
        #
        # LLM_MODEL accepts a comma-separated fallback chain ("primary:free,backup:free").
        # A single pinned slug is how nine consecutive runs died: OpenRouter withdrew the
        # ":free" variant and there was nothing to fall back to.
        #
        # `auto` now returns 1 (rather than raising) when the scan itself fails, having first
        # written a "failed" row to the coverage ledger. continue-on-error lets the commit step
        # below publish that row — a dead day has to be visible on the site, not just in an
        # inbox nobody reads. The "Surface failure" step still fails the run afterwards.
        continue-on-error: true
        id: scan
        run: python -m conflict_updater auto cursor --limit 5

      - name: Snapshot quality + last run for the public site
        # NOT coverage.json — the pipeline now writes the ledger straight to the tracked
        # src/data/coverage.json. Copying it from the gitignored out/ dir used to DESTROY it:
        # a CI checkout has no out/, so load_coverage() returned [] and the run published a
        # one-row file over the entire history. The ledger is also what the day-cursor reads to
        # know which days are done, so it has to survive between runs.
        #
        # These two are still snapshots: they are genuine run artifacts, and the eval history
        # only exists once a backtest has been run, so its copy is best-effort.
        if: always()
        run: |
          cp ai-updater/out/eval_history.json src/data/eval-history.json || true
          cp ai-updater/out/latest_run.json src/data/latest-run.json || true

      - name: Commit the update + findings log
        if: always()
        run: |
          git config user.name "conflict-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/seed.json src/data/coverage.json src/data/eval-history.json src/data/latest-run.json ai-updater/log/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "daily: auto-update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true   # a push race must not stall the cursor
          git push

      - name: Daily report
        # Renders on the run's own page in the Actions tab. This is the "where do I read what
        # happened last week" answer that needs no commit and no server: GitHub stores it with
        # the run, and nothing lands in the repo.
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          led = pathlib.Path("src/data/coverage.json")   # the tracked ledger, written directly
          rows = json.loads(led.read_text(encoding="utf-8")) if led.exists() else []
          if not rows:
              print("## Daily conflict update\n\nNo ledger entry was written — the run failed before scanning.")
          else:
              e = rows[-1]
              ok = e.get("status") != "failed"
              print(f"## Daily conflict update — {'✅' if ok else '❌'} {e.get('status')}")
              print()
              print(f"**Window** `{e.get('period')}`  ·  **prompts** `{e.get('prompt_version')}`")
              print()
              if not ok:
                  print(f"> {e.get('error')}")
              else:
                  print("| articles | events found | already known | applied | held for review | errored |")
                  print("|---:|---:|---:|---:|---:|---:|")
                  print(f"| {e.get('items',0)} | {e.get('events_found',0)} | {e.get('dropped',0)} "
                        f"| {e.get('applied',0)} | {e.get('held',0)} | {e.get('failed',0)} |")
              print()
              print(f"_{len(rows)} scans in the ledger._")
          # the human-readable digest, if this run produced one
          logs = sorted(pathlib.Path("ai-updater/log").glob("*.md")) if pathlib.Path("ai-updater/log").exists() else []
          if logs:
              print("\n<details><summary>Latest digest</summary>\n")
              print(logs[-1].read_text(encoding="utf-8")[:6000])
              print("\n</details>")
          PY

      - name: Archive run logs
        # Artifacts persist with the run and are downloadable, but are NEVER committed. This is
        # where the bulky per-run output lives so the repo only ever carries the dataset itself.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_number }}
          path: |
            ai-updater/out/
            ai-updater/log/
          retention-days: 90
          if-no-files-found: ignore

      - name: Surface failure
        # Turns the run red so the notification fires, but only after the blind window has
        # been committed and published.
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Daily scan failed — a 'failed' row was written to the coverage ledger."
          exit 1
