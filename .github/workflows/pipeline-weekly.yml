name: Weekly conflict update

# Runs in the cloud on a schedule — your PC does not need to be on. It scans the past
# week, AUTO-APPLIES only the confidently-corroborated findings to seed.json, writes a
# plain-English digest to ai-updater/log/, and pushes (which redeploys the live map).
# Everything is reversible via git history. Nothing here needs a human.

on:
  schedule:
    - cron: "0 6 * * 1"      # every Monday 06:00 UTC
  workflow_dispatch: {}        # ...and a manual "Run" button for testing

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline
        run: pip install -r ai-updater/requirements.txt

      - name: Scan the week and auto-apply confident findings
        working-directory: ai-updater
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        # ~3 LLM calls per candidate now (batched), so 12 candidates ≈ 38 calls — inside the
        # OpenRouter free ~50/day. Raise toward 15 only if you have paid/higher quota.
        #
        # LLM_MODEL accepts a comma-separated fallback chain ("primary:free,backup:free").
        # A single pinned slug is how nine consecutive runs died: OpenRouter withdrew the
        # ":free" variant and there was nothing to fall back to.
        #
        # `auto` now returns 1 (rather than raising) when the scan itself fails, having first
        # written a "failed" row to the coverage ledger. continue-on-error lets the commit step
        # below publish that row — a dead week has to be visible on the site, not just in an
        # inbox nobody reads. The "Surface failure" step still fails the run afterwards.
        continue-on-error: true
        id: scan
        run: python -m conflict_updater auto week --limit 12

      - name: Snapshot coverage for the public site
        # Runs even after a failed scan: the ledger entry recording the blind window is
        # exactly what needs publishing.
        if: always()
        run: cp ai-updater/out/coverage.json src/data/coverage.json || true

      - name: Commit the update + findings log
        if: always()
        run: |
          git config user.name "conflict-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/seed.json src/data/coverage.json ai-updater/log/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "weekly: auto-update $(date -u +%Y-%m-%d)"
          git push

      - name: Weekly report
        # Renders on the run's own page in the Actions tab. This is the "where do I read what
        # happened last week" answer that needs no commit and no server: GitHub stores it with
        # the run, and nothing lands in the repo.
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          led = pathlib.Path("ai-updater/out/coverage.json")
          rows = json.loads(led.read_text(encoding="utf-8")) if led.exists() else []
          if not rows:
              print("## Weekly conflict update\n\nNo ledger entry was written — the run failed before scanning.")
          else:
              e = rows[-1]
              ok = e.get("status") != "failed"
              print(f"## Weekly conflict update — {'✅' if ok else '❌'} {e.get('status')}")
              print()
              print(f"**Window** `{e.get('period')}`  ·  **prompts** `{e.get('prompt_version')}`")
              print()
              if not ok:
                  print(f"> {e.get('error')}")
              else:
                  print("| articles | events found | already known | applied | held for review | errored |")
                  print("|---:|---:|---:|---:|---:|---:|")
                  print(f"| {e.get('items',0)} | {e.get('events_found',0)} | {e.get('dropped',0)} "
                        f"| {e.get('applied',0)} | {e.get('held',0)} | {e.get('failed',0)} |")
              print()
              print(f"_{len(rows)} scans in the ledger._")
          # the human-readable digest, if this run produced one
          logs = sorted(pathlib.Path("ai-updater/log").glob("*.md")) if pathlib.Path("ai-updater/log").exists() else []
          if logs:
              print("\n<details><summary>Latest digest</summary>\n")
              print(logs[-1].read_text(encoding="utf-8")[:6000])
              print("\n</details>")
          PY

      - name: Archive run logs
        # Artifacts persist with the run and are downloadable, but are NEVER committed. This is
        # where the bulky per-run output lives so the repo only ever carries the dataset itself.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_number }}
          path: |
            ai-updater/out/
            ai-updater/log/
          retention-days: 90
          if-no-files-found: ignore

      - name: Surface failure
        # Turns the run red so the notification fires, but only after the blind window has
        # been committed and published.
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Weekly scan failed — a 'failed' row was written to the coverage ledger."
          exit 1
